<!doctype html><meta charset="utf-8"><title>inspect</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from './vendor/three.module.js';
import { SiloWorld } from './src/world.js';
import { CafeteriaOpening } from './src/opening.js';
import { Population } from './src/population.js';
import { CharacterCast } from './src/characters.js';
import { topPoint } from './src/surface.js';
import { levelY, TAU } from './src/data.js';
import { Rendering, makeEnvironment } from './src/rendering.js';
const q=new URLSearchParams(location.search);
const N=v=>Number(q.get(v));
const W=N('w')||1280,H=N('h')||720;
const canvas=document.getElementById('c');canvas.width=W;canvas.height=H;
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setSize(W,H,false);renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.setClearColor(0x111b17);
const scene=new THREE.Scene();
const world=new SiloWorld(scene);
const rendering=new Rendering(renderer);makeEnvironment(renderer,scene);
await world.loadAssets(()=>{});
world.quality='high';
const level=N('level')||50;
const special=q.get('special')||null;
world.setLevel(level,special);
const cam=new THREE.PerspectiveCamera(N('fov')||68,W/H,.1,2300);
let pos;
if(q.get('top')==='1'){pos=topPoint(N('x'),N('y')||1.7,N('z'));}
else pos=new THREE.Vector3(N('x'),levelY(level)+(N('y')||1.7),N('z'));
// settle the light rig the way a walk would
for(let i=0;i<200;i++)world.update(1/60,pos);
cam.position.copy(pos);
let look;
if(q.get('top')==='1')look=topPoint(N('lx'),N('ly')||1.6,N('lz'));
else look=new THREE.Vector3(N('lx'),levelY(level)+(N('ly')||1.6),N('lz'));
cam.lookAt(look);
if(q.get('pop')==='1'){const p=new Population(scene,world);p.update(0,{position:pos,horizontalSpeed:0},false,'juliette');}
rendering.resize();
if(q.get('post')==='0')renderer.render(scene,cam);else rendering.render(scene,cam);
document.title='ready';
</script>
